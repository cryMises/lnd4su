name: step0b-probe

# Builds the 2-worker capacity probe image. Same reason as step0: the box is
# crowded, so no isolate build ever happens there.
on:
  push:
    branches: [main]
    paths: [step0b/**, .github/workflows/step0b.yml]
  workflow_dispatch:

jobs:
  probe-image:
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: step0b
          platforms: linux/arm64
          push: true
          tags: ghcr.io/crymises/lnd4su-step0b:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
