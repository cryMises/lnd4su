name: build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: sha
        run: echo "short=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          push: true
          tags: |
            ghcr.io/crymises/lnd4su:latest
            ghcr.io/crymises/lnd4su:sha-${{ steps.sha.outputs.short }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        run: |
          {
            echo "### lnd4su image"
            echo ""
            echo "- digest: \`${{ steps.build.outputs.digest }}\`"
            echo "- tag: \`ghcr.io/crymises/lnd4su:sha-${{ steps.sha.outputs.short }}\`"
            echo "- note: pulling this image over a slow link takes a few minutes; check \`docker compose pull\` progress before assuming a hang"
          } >> "$GITHUB_STEP_SUMMARY"
