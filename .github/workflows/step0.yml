name: step0-probe

# Builds the sandbox probe image so the box never compiles isolate itself
# (music-vm is crowded; the spec prefers probing via Actions).
on:
  push:
    branches: [main]
    paths: [step0/**, .github/workflows/step0.yml]
  workflow_dispatch:

jobs:
  probe-image:
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: step0
          platforms: linux/arm64
          push: true
          tags: ghcr.io/crymises/lnd4su-step0:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
